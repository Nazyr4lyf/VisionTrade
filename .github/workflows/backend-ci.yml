name: Backend CI

on:
  push:
    branches:
      - main
      - feature/crypto-scalping-foundation
      - feature/live-monitoring-snapshot
      - fix/monitoring-reliability-v5
    paths:
      - "backend/**"
      - "supabase/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Build Render worker image
        run: docker build --tag visiontrade-worker:test .
